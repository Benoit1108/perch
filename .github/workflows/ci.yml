name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Aucun job n'a besoin d'écrire quoi que ce soit sur le dépôt.
permissions:
  contents: read

jobs:
  health:
    name: Portes de qualité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Étapes séparées plutôt qu'un seul `npm run health` : quand la CI rougit, on veut
      # voir LAQUELLE a lâché sans dérouler un journal.
      - name: Formatage
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Architecture (dependency-cruiser)
        run: npm run deps
      - name: Code mort (knip)
        run: npm run dead
      - name: Tests et couverture
        run: npm test

  guardrails:
    name: Les garde-fous protègent-ils encore ?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Introduit délibérément des violations et exige qu'elles soient rejetées.
      # Une règle mal ciblée laisse `health` au vert tout en ne protégeant plus rien.
      - name: Vérification des garde-fous
        run: npm run verify:guardrails

  commits:
    name: Convention de commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sans ce job, commitlint était installé, configuré… et invoqué nulle part :
      # « Conventional Commits vérifiés » n'était qu'une intention.
      - name: commitlint
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose

  audit:
    name: Vulnérabilités
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Pas `npm audit --audit-level=high` directement : il echouait en permanence sur des
      # avis sans correctif amont, ce qui apprend a ignorer la porte. Le script accepte une
      # liste nommee et justifiee, et refuse tout le reste.
      - name: Vulnérabilités
        run: npm run audit

  windows:
    name: Construction Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Le pack de créatures est fabriqué ICI, jamais committé (invariant I5). Sans lui,
      # l'installeur livrerait un compagnon sans visage — ce qu'un non-technicien ne
      # saurait pas réparer.
      - name: Pillow, pour découper les images
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Fabrication du pack
        run: npm run pack:fetch

      - name: Construction de l'installeur
        run: npm run dist:win

      # Une construction qui produit un fichier ne prouve rien : on lance l'application
      # empaquetée et on exige qu'elle s'arrête d'elle-même, proprement.
      - name: Test de fumée
        run: node scripts/smoke-packaged.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: perch-windows
          path: release/*.exe
          if-no-files-found: error
