<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- Aucune source `unsafe-inline` : le style et le script vivent dans des fichiers
         voisins. Cette page affiche des chemins de dépôts et des libellés de tâches, donc
         du texte que l'utilisateur a écrit ; sans cette restriction, un gestionnaire
         d'événement glissé dans un libellé s'exécuterait. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'"
    />
    <title>Perch</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <h1>Perch</h1>
    <p class="sous" data-texte="privacy"></p>

    <section>
      <h2 data-texte="language"></h2>
      <select id="locale">
        <option value="" data-texte="systemLanguage"></option>
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </section>

    <section>
      <h2 data-texte="companion"></h2>
      <button id="compagnon" data-texte="changeCompanion"></button>
      <p class="aide" data-texte="companionHelp"></p>
    </section>

    <section>
      <h2 data-texte="private"></h2>
      <label>
        <input type="checkbox" id="prive" />
        <span data-texte="privateToggle"></span>
      </label>
      <p class="aide" data-texte="privateHelp"></p>
    </section>

    <section>
      <h2 data-texte="repos"></h2>
      <p class="aide" data-texte="reposHelp"></p>
      <ul id="depots"></ul>
    </section>

    <section>
      <h2 data-texte="tasks"></h2>
      <ul id="taches"></ul>
      <div class="ligne">
        <input type="text" id="nouvelle" />
        <button id="ajouter" data-texte="add"></button>
      </div>
    </section>

    <div id="etat"></div>

    <script src="settings.js"></script>
  </body>
</html>
