<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!--
      Aucune source `unsafe-inline` : le style et le script vivent dans des fichiers
      voisins, servis depuis le dossier de la page. C'est plus strict que la version
      précédente, où toute injection dans le HTML se serait exécutée — et cette page est
      toujours au premier plan, au-dessus de tout le bureau.

      `img-src data:` seulement : les sprites arrivent encodés par IPC, cette page n'a
      accès ni au disque ni au réseau.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self'"
    />
    <title>Perch</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <svg id="surfaces"></svg>
    <div id="pet">
      <div id="bulle"></div>
      <div id="eclat"></div>
      <div id="repli"></div>
      <img id="corps" alt="" hidden />
    </div>
    <div id="hud" hidden></div>

    <script src="overlay.js"></script>
  </body>
</html>
